<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع الوصفات | شهيريان</title>
    <meta name="description" content="تصفح جميع الوصفات من شهيريان التي تحتوي على البرغل والوصفات العائلية التقليدية.">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="back-home-button" style="display: none;">
        <a href="../index.ar.html">← العودة إلى الرئيسية</a>
    </div>

    <section class="all-recipes-page">
        <div class="all-recipes-header">
            <h1>جميع الوصفات</h1>
            <p class="all-recipes-intro">اكتشف مجموعتنا من الوصفات التقليدية التي تحتوي على برغل شهيريان.</p>
        </div>

        <div id="all-recipes-container" class="all-recipes-grid">
            <!-- all-recipes will be rendered here from sections/recipes/recipes.ar.json -->
        </div>

        <div class="all-recipes-footer">
            <a href="../index.ar.html#recipes" class="back-to-featured">← العودة إلى الوصفات المميزة</a>
        </div>
    </section>

    <script src="../assets/js/lang-switcher.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const backBtn = document.querySelector('.back-home-button');
            if (window.scrollY > 100) {
                backBtn.style.display = 'block';
            } else {
                backBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
