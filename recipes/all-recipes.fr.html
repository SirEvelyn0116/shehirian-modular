<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes les recettes | Shehirian</title>
    <meta name="description" content="Parcourez toutes les recettes de Shehirian mettant en vedette le blé bulgur et les recettes familiales traditionnelles.">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="back-home-button" style="display: none;">
        <a href="../index.fr.html">← Retour à l'accueil</a>
    </div>

    <section class="all-recipes-page">
        <div class="all-recipes-header">
            <h1>Toutes les recettes</h1>
            <p class="all-recipes-intro">Découvrez notre collection de recettes traditionnelles mettant en vedette le blé bulgur Shehirian.</p>
        </div>

        <div id="all-recipes-container" class="all-recipes-grid">
            <!-- all-recipes will be rendered here from sections/recipes/recipes.fr.json -->
        </div>

        <div class="all-recipes-footer">
            <a href="../index.fr.html#recipes" class="back-to-featured">← Retour aux recettes vedettes</a>
        </div>
    </section>

    <script src="../assets/js/lang-switcher.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const backBtn = document.querySelector('.back-home-button');
            if (window.scrollY > 100) {
                backBtn.style.display = 'block';
            } else {
                backBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
