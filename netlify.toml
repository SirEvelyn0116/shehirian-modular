[build]
  # Step 1: Build the Recipes admin React island, Step 2: Sync Google Sheets,
  # Step 3: Generate all 212+ pages (copies admin/, including recipes-dist/)
  command = "npm run build:recipes && node sync-google-sheets.js && node generate-index.js"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# trigger-sync.js already checks for the 'translator' role
#  conditions = {Role = ["translator", "admin"]}