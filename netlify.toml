[build]
  # Step 1: Build the Recipes admin React island, Step 2: Sync Google Sheets,
  # Step 3: Generate all 212+ pages (copies admin/, including recipes-dist/)
  command = "npm run build:recipes && node sync-google-sheets.js && node generate-index.js"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Recipes read API (role gate enforced inside each function, not here).
# recipe-detail.js reads the slug from event.path, not a query param —
# the named-placeholder-into-query-string form (?slug=:slug) matches
# locally under netlify dev but the real edge never substitutes it,
# so queryStringParameters comes back empty in production.
[[redirects]]
  from = "/api/recipes/*"
  to = "/.netlify/functions/recipe-detail"
  status = 200

[[redirects]]
  from = "/api/recipes"
  to = "/.netlify/functions/recipes-list"
  status = 200

# trigger-sync.js already checks for the 'translator' role
#  conditions = {Role = ["translator", "admin"]}