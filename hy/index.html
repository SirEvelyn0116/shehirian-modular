<!DOCTYPE html>
<html lang="hy" data-site-base-url="/shehirian-modular">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shehirian Bulgor Inc</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/pp-neue-montreal" rel="stylesheet">
  <link rel="alternate" hreflang="x-default" href="/shehirian-modular/en/index.html" />
  <link rel="alternate" hreflang="en" href="/shehirian-modular/en/index.html" />
  <link rel="alternate" hreflang="fr" href="/shehirian-modular/fr/index.html" />
  <link rel="alternate" hreflang="ar" href="/shehirian-modular/ar/index.html" />
  <link rel="alternate" hreflang="hy" href="/shehirian-modular/hy/index.html" />
  
</head>
<body dir="ltr">
  <div class="background">
    <div id="language-switcher" class="lang-switcher-nav">
      <a href="/shehirian-modular/en/index.html" class="flag" title="English" aria-label="English">
        <img src="../assets/img/flags/gb.svg" alt="English">
        <span class="code">EN</span>
      </a>
      <a href="/shehirian-modular/fr/index.html" class="flag" title="Français" aria-label="Français">
        <img src="../assets/img/flags/fr.svg" alt="Français">
        <span class="code">FR</span>
      </a>
      <a href="/shehirian-modular/ar/index.html" class="flag" title="العربية" aria-label="العربية">
        <img src="../assets/img/flags/lb.svg" alt="العربية">
        <span class="code">AR</span>
      </a>
      <a href="/shehirian-modular/hy/index.html" class="flag" title="Հայերեն" aria-label="Հայերեն">
        <img src="../assets/img/flags/am.svg" alt="Հայերեն">
        <span class="code">HY</span>
      </a>
    </div>

    <!-- Floating Back/Home Button -->
    <div class="back-home-button" id="backHomeButton">
      <a href="#home">Վերադառնալ / Գլխավոր</a>
    </div>

    <div id="preview"></div>
  </div>

  <!-- Load all section render functions -->
  <script src="../sections/hero/render.js"></script>
  <script src="../sections/aboutUs/render.js"></script>
  <script src="../sections/ourCompanies/render.js"></script>
  <script src="../sections/recipes/render.js"></script>
  <script src="../sections/certifications/render.js"></script>
  <script src="../sections/contactUs/render.js"></script>
  
  <!-- Set language and load preview -->
  <script>
    window.__siteBaseUrl = '/shehirian-modular';
    localStorage.setItem('lang', 'hy');
  </script>
  <script src="../preview.js"></script>
  
  <!-- Back/Home button visibility script -->
  <script>
    window.addEventListener('scroll', () => {
      const backHomeButton = document.getElementById('backHomeButton');
      const homeSection = document.getElementById('home');
      
      if (homeSection && backHomeButton) {
        const homeBottom = homeSection.offsetTop + homeSection.offsetHeight;
        const scrollPosition = window.scrollY;
        
        if (scrollPosition > homeBottom - 100) {
          backHomeButton.classList.add('visible');
        } else {
          backHomeButton.classList.remove('visible');
        }
      }
    });
  </script>
</body>
</html>
