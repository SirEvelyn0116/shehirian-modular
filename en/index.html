  <script type="application/ld+json">{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Featured Recipes",
  "description": "Featured recipes from Shehirian featuring bulgur wheat",

  "itemListElement": [
    {
      "@type": "Recipe",
      "position": 1,
      "name": "Armenian Style Lentil Soup",
      "description": "A hearty soup with lentils, mint, and parsley — a Shehirian family classic.",
      "recipeIngredient": [
        "1/2 cup water",
        "1/2 cup lentils",
        "1/2 cup chopped onion",
        "1/2 cup chopped parsley",
        "1/2 tsp. salt",
        "1/2 tsp. pepper",
        "1/2 cup butter or margarine",
        "1/2 cup chopped mint"
      ],
      "recipeInstructions": [
        {
          "@type": "HowToStep",
          "text": "Boil lentils in water for 15 minutes."
        },
        {
          "@type": "HowToStep",
          "text": "Add onion, parsley, salt, and pepper. Simmer for 45 minutes."
        },
        {
          "@type": "HowToStep",
          "text": "Add mint and butter. Simmer for 15 minutes."
        },
        {
          "@type": "HowToStep",
          "text": "Add 1/4 tsp. pepper and cook for 5 minutes."
        },
        {
          "@type": "HowToStep",
          "text": "Optional: Fry butter until light brown and pour over soup."
        }
      ],
      "recipeCategory": "Soup",
      "recipeCuisine": "Armenian"
    },
    {
      "@type": "Recipe",
      "position": 2,
      "name": "Royal Soup",
      "description": "A lemony meatball soup with rice and parsley, inspired by Middle Eastern flavors.",
      "recipeIngredient": [
        "1/2 gallon chicken broth",
        "1/2 lb. ground beef (not too lean)",
        "1/4 cup raw rice",
        "1/4 cup very finely chopped onion",
        "1/4 cup parsley",
        "1/4 cup lemon juice",
        "1/4 cup finely chopped celery",
        "1/4 tsp. salt",
        "Slice of 2 lemons"
      ],
      "recipeInstructions": [
        {
          "@type": "HowToStep",
          "text": "Mix raw meat, bulghur wheat, onion, parsley and seasoning together and shape into 1\" diameter balls."
        },
        {
          "@type": "HowToStep",
          "text": "Add rice to the meat balls mixture."
        },
        {
          "@type": "HowToStep",
          "text": "Add meat balls to hot chicken broth and simmer until cooked through."
        },
        {
          "@type": "HowToStep",
          "text": "Add lemon juice and celery. Simmer for 10 minutes."
        },
        {
          "@type": "HowToStep",
          "text": "Add salt and lemon slices. Simmer for 5 minutes."
        },
        {
          "@type": "HowToStep",
          "text": "Adjust sourness, saltiness, or thickness with sugar, water, or rice as needed."
        },
        {
          "@type": "HowToStep",
          "text": "Pour broth over meatballs and serve."
        }
      ],
      "recipeCategory": "Soup",
      "recipeCuisine": "Middle Eastern"
    },
    {
      "@type": "Recipe",
      "position": 3,
      "name": "Scotch Broth with Bulgur Wheat",
      "description": "A traditional Scottish soup transformed with hearty bulgur wheat and lamb.",
      "recipeIngredient": [
        "2 lbs. lamb shoulder",
        "8 cups water",
        "1/2 cup bulgur wheat",
        "1 cup diced carrots",
        "1 cup diced turnip",
        "1 cup chopped leeks",
        "1/2 cup pearl barley",
        "Salt and pepper to taste",
        "Fresh parsley for garnish"
      ],
      "recipeInstructions": [
        {
          "@type": "HowToStep",
          "text": "In a large pot, add lamb and water. Bring to a boil and skim off any foam."
        },
        {
          "@type": "HowToStep",
          "text": "Reduce heat and simmer for 1 hour until lamb is tender."
        },
        {
          "@type": "HowToStep",
          "text": "Remove lamb, shred meat, and return to pot."
        },
        {
          "@type": "HowToStep",
          "text": "Add bulgur wheat, barley, carrots, turnip, and leeks."
        },
        {
          "@type": "HowToStep",
          "text": "Simmer for 45 minutes until grains and vegetables are tender."
        },
        {
          "@type": "HowToStep",
          "text": "Season with salt and pepper."
        },
        {
          "@type": "HowToStep",
          "text": "Serve hot, garnished with fresh parsley."
        }
      ],
      "recipeCategory": "Soup",
      "recipeCuisine": "Scottish"
    }
  ]

  <!-- Back/Home button visibility script -->
  <script>
    window.addEventListener('scroll', () => {
      const backHomeButton = document.getElementById('backHomeButton');
      const homeSection = document.getElementById('home');
      
      if (homeSection && backHomeButton) {
        const homeBottom = homeSection.offsetTop + homeSection.offsetHeight;
        const scrollPosition = window.scrollY;
        
        if (scrollPosition > homeBottom - 100) {
          backHomeButton.classList.add('visible');
        } else {
          backHomeButton.classList.remove('visible');
        }
      }
    });
  </script>
