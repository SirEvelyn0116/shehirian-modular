name: E2E Tests

on:
  push:
    branches: [main, styled-v1]
  pull_request:
    branches: [main, styled-v1]
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Build verification job - ensures site can be built before testing
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build site
        # No BASE_URL prefix: the test job serves dist/ at http://127.0.0.1:8080
        # with no path prefix, so links must be root-relative (e.g. /fr/index.html).
        # Deployment workflows (Production-Deploy, preview) set their own BASE_URL.
        run: npm run build
      
      - name: Verify build output
        run: |
          # Check that all language index files were generated
          test -f dist/en/index.html || exit 1
          test -f dist/fr/index.html || exit 1
          test -f dist/ar/index.html || exit 1
          test -f dist/hy/index.html || exit 1
          
          # Check that language-specific recipe index pages exist
          test -f dist/en/recipes/index.html || exit 1
          test -f dist/fr/recipes/index.html || exit 1
          test -f dist/ar/recipes/index.html || exit 1
          test -f dist/hy/recipes/index.html || exit 1

          # Check that language-specific certification pages exist
          test -f dist/en/certifications/brc.html || exit 1
          test -f dist/fr/certifications/sqf.html || exit 1
          test -f dist/ar/certifications/ifs.html || exit 1
          test -f dist/hy/certifications/fssc-22000.html || exit 1

          # Check that language-specific product pages exist
          test -f dist/en/products/shirag.html || exit 1
          test -f dist/en/products/mr-falafel.html || exit 1
          test -f dist/fr/products/shirag.html || exit 1
          test -f dist/fr/products/mr-falafel.html || exit 1
          test -f dist/ar/products/shirag.html || exit 1
          test -f dist/ar/products/mr-falafel.html || exit 1
          test -f dist/hy/products/shirag.html || exit 1
          test -f dist/hy/products/mr-falafel.html || exit 1
          
          # Check that recipe JSON files exist
          test -f dist/sections/recipes/recipes.en.json || exit 1
          test -f dist/sections/recipes/recipes.fr.json || exit 1
          test -f dist/sections/recipes/recipes.ar.json || exit 1
          test -f dist/sections/recipes/recipes.hy.json || exit 1
          
          echo "✅ All expected build outputs verified"
      
      - name: Validate JSON files
        run: |
          # Validate all JSON files are valid
          find dist/sections -name "*.json" -exec node -e "JSON.parse(require('fs').readFileSync('{}', 'utf8'))" \;
          echo "✅ All JSON files are valid"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Start local test server
        run: |
          npx http-server dist -p 8080 > http-server.log 2>&1 &
          for attempt in {1..20}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/en/index.html || true)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          cat http-server.log
          exit 1
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --project=${{ matrix.browser }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
      
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  # Publish test results as GitHub Pages
  publish-report:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      
      - name: Merge reports
        run: |
          mkdir -p merged-reports
          find all-reports -name "*.json" -exec cp {} merged-reports/ \; || true
      
      - name: Upload merged reports
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-reports
          path: merged-reports/
          retention-days: 30
