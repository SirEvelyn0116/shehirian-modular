# Weekly dependency update pull requests into translation-pipeline.
# GitHub reads this file from the repository's default branch only, so it
# takes effect once it is on the default branch (see TESTING.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: translation-pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: translation-pipeline
    schedule:
      interval: weekly
