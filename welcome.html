<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — Shehirian Translation Portal</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    @font-face {
      font-family: 'Elgar';
      src: url('./assets/fonts/elgar.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --wheat:  #f5ede0;
      --grain:  #e8d5b5;
      --sienna: #8b4513;
      --umber:  #5c2d0a;
      --cream:  #fdf8f2;
      --ink:    #1a1208;
      --muted:  #7a6a55;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .card {
      background: white;
      border: 1px solid var(--grain);
      border-radius: 3px;
      padding: 2.75rem 3.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 1px 3px rgba(91,45,10,0.06),
        0 8px 32px rgba(91,45,10,0.08),
        inset 0 1px 0 rgba(255,255,255,0.9);
      animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .brand-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-family: 'Elgar', serif;
      font-size: 1.55rem;
      color: var(--umber);
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .brand-sub {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--grain), transparent);
      margin-bottom: 1.75rem;
    }

    .heading {
      font-family: 'Elgar', serif;
      font-size: 1.55rem;
      color: var(--umber);
      margin-bottom: 0.6rem;
      line-height: 1.25;
    }

    .subtext {
      font-size: 0.78rem;
      line-height: 1.75;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      font-size: 0.78rem;
      line-height: 1.5;
      padding: 0.85rem 1rem;
      border-radius: 2px;
      margin-bottom: 1.25rem;
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .status.waiting  { background: var(--wheat); color: var(--umber); border-left: 3px solid var(--grain); }
    .status.waiting .status-dot { background: var(--sienna); animation: pulse 2s infinite; }
    .status.success  { background: #f0fdf4; color: #166534; border-left: 3px solid #86efac; }
    .status.success .status-dot { background: #16a34a; }
    .status.error    { background: #fff1f2; color: #991b1b; border-left: 3px solid #fca5a5; }
    .status.error .status-dot   { background: #dc2626; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .redirect-notice {
      display: none;
      text-align: center;
      padding: 1.5rem 0 0;
    }

    .redirect-notice p {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--grain);
      border-top-color: var(--sienna);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.6rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--grain);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-langs { display: flex; gap: 0.5rem; }
    .lang-pip {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--grain);
    }
  </style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="brand">
      <img class="brand-logo" src="./assets/img/Shirag-2.png" alt="Shehirian Bulgur" />
      <div>
        <!-- site_title.en from ui-strings.json -->
        <div class="brand-name">Shehirian Bulgor Inc.</div>
        <div class="brand-sub">Translation Portal</div>
      </div>
    </div>

    <div class="divider"></div>

    <h1 class="heading">Welcome,<br/>translator.</h1>
    <p class="subtext">
      Set your password below to activate your account.<br/>
      You'll manage translations across English, French, Arabic, and Armenian.
    </p>

    <div class="status waiting" id="status-box">
      <span class="status-dot"></span>
      <span id="status-text">Waiting for identity confirmation…</span>
    </div>

    <div id="netlify-identity-widget-container"></div>

    <div class="redirect-notice" id="redirect-notice">
      <div class="spinner"></div>
      <p>Taking you to the dashboard…</p>
    </div>

    <div class="footer">
      <span>Shehirian Bulgur Inc.</span>
      <div class="footer-langs">
        <span class="lang-pip" title="English"></span>
        <span class="lang-pip" title="Français"></span>
        <span class="lang-pip" title="العربية"></span>
        <span class="lang-pip" title="Հայերեն"></span>
      </div>
    </div>

  </div>
</div>

<script>
  const netlifyIdentity = window.netlifyIdentity;

  function setStatus(type, message) {
    document.getElementById('status-box').className = 'status ' + type;
    document.getElementById('status-text').textContent = message;
  }

  netlifyIdentity.on('init', user => {
    if (!user) {
      const hash = window.location.hash || '';
      if (hash.includes('invite_token')) {
        setStatus('waiting', 'Invite detected — opening password setup…');
        setTimeout(() => netlifyIdentity.open('signup'), 400);
      } else if (hash.includes('recovery_token')) {
        setStatus('waiting', 'Recovery link detected — opening password reset…');
        // recovery_token needs the 'login' panel, not 'signup' — .open(action)
        // forces that modal page regardless of which token the widget verified,
        // and 'signup' is the public-registration form, blocked on invite-only sites.
        setTimeout(() => netlifyIdentity.open('login'), 400);
      } else if (hash.includes('confirmation_token')) {
        setStatus('waiting', 'Confirming your email…');
        setTimeout(() => netlifyIdentity.open(), 400);
      } else {
        setStatus('waiting', 'No invite token found. Please use the link from your invitation email.');
      }
    } else {
      redirectToAdmin();
    }
  });

  function getRoles(user) {
    return (user && (
      (user.app_metadata && user.app_metadata.authorization && user.app_metadata.authorization.roles) ||
      (user.app_metadata && user.app_metadata.roles)
    )) || [];
  }

  netlifyIdentity.on('login', user => {
    const roles = getRoles(user);
    if (roles.includes('translator') || roles.includes('approver') || roles.length === 0) {
      setStatus('success', `Welcome, ${user.email}. Password set successfully!`);
      redirectToAdmin();
    } else {
      setStatus('error', 'Your account does not have translator access. Please contact the site administrator.');
      netlifyIdentity.logout();
    }
  });

  netlifyIdentity.on('error', err => {
    setStatus('error', 'Something went wrong: ' + (err.message || err));
  });

  function redirectToAdmin() {
    document.getElementById('redirect-notice').style.display = 'block';
    setTimeout(() => { window.location.href = '/admin/#welcome=1'; }, 1800);
  }
</script>

</body>
</html>
